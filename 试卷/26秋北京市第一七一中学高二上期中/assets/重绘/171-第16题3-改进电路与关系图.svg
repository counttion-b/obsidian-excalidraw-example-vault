<path d="M145 96 V62 M310 96 V62" stroke-width="1.5"/>
<path d="M148 72 H307" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke-width="1.5"/>
<!-- graph -->
<path d="M720 365 V110" marker-end="url(#arrow)"/><path d="M720 365 H1030" marker-end="url(#arrow)"/>
<path d="M720 310 L996 139" stroke-width="3"/>
<path d="M720 170 H946 V365" stroke-dasharray="7 6" stroke-width="1.7"/>
<path d="M710 65 H740" stroke-width="1.5"/>
</g>
<g fill="black"><circle cx="110" cy="105" r="4"/><circle cx="155" cy="195" r="4"/><circle cx="90" cy="285" r="4"/><circle cx="470" cy="195" r="4"/><circle cx="260" cy="370" r="3"/><circle cx="305" cy="370" r="3"/>
